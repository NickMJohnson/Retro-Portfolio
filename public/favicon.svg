<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#080b0f"/>
  <rect x="1" y="1" width="30" height="30" rx="5.5" stroke="#00ffea" stroke-opacity="0.3" stroke-width="0.75"/>
  <!-- > symbol -->
  <polyline points="7,11 13,16 7,21" stroke="#00ffea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- _ cursor -->
  <line x1="16" y1="21" x2="24" y2="21" stroke="#00ffea" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
